services:
  postgres:
    image: postgres:17-alpine
    container_name: golang_baoan_thao_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: service_management
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d service_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: golang_baoan_thao_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: host=postgres user=postgres password=123456 dbname=service_management port=5432 sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
