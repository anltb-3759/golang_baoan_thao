{{ template "admin/partials/head.html" . }}
<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="text-center space-y-4 px-6">
    <div class="text-8xl font-bold text-indigo-600">{{ .Code }}</div>
    <h1 class="text-2xl font-semibold text-gray-900">{{ .Heading }}</h1>
    <p class="text-sm text-gray-500 max-w-sm mx-auto">{{ .Message }}</p>
    <div class="pt-2">
      <a href="/admin"
         class="inline-flex items-center gap-2 bg-indigo-600 text-white px-4 py-2 rounded-md text-sm hover:bg-indigo-700">
        <i data-lucide="home" class="h-4 w-4"></i>
        {{ t "ui.nav.dashboard" }}
      </a>
    </div>
  </div>
</div>
{{ template "admin/partials/foot.html" . }}
