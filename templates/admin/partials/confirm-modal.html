<!-- Confirm Modal — controlled via data-modal-trigger buttons -->
<div id="confirm-modal"
     class="fixed inset-0 z-50 flex items-center justify-center hidden"
     role="dialog" aria-modal="true">
  <!-- Backdrop -->
  <div id="confirm-modal-backdrop"
       class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>

  <!-- Dialog box -->
  <div class="relative z-10 bg-white rounded-xl shadow-xl border border-gray-200 w-full max-w-sm mx-4 p-6">
    <div class="flex items-start gap-3">
      <div id="confirm-modal-icon-wrap"
           class="flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-full">
        <i id="confirm-modal-icon" class="h-5 w-5"></i>
      </div>
      <div class="flex-1 min-w-0">
        <h3 id="confirm-modal-title" class="text-sm font-semibold text-gray-900"></h3>
        <p id="confirm-modal-message" class="mt-1 text-sm text-gray-500"></p>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button id="confirm-modal-cancel"
              class="px-4 py-2 text-sm rounded-md border border-gray-300 bg-white text-gray-700 hover:bg-gray-50">
        {{ t "ui.users.form.cancel" }}
      </button>
      <button id="confirm-modal-confirm"
              class="px-4 py-2 text-sm rounded-md text-white">
        {{ t "ui.modal.confirm" }}
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  var modal     = document.getElementById('confirm-modal');
  var backdrop  = document.getElementById('confirm-modal-backdrop');
  var titleEl   = document.getElementById('confirm-modal-title');
  var msgEl     = document.getElementById('confirm-modal-message');
  var iconEl    = document.getElementById('confirm-modal-icon');
  var iconWrap  = document.getElementById('confirm-modal-icon-wrap');
  var cancelBtn = document.getElementById('confirm-modal-cancel');
  var confirmBtn= document.getElementById('confirm-modal-confirm');
  var pendingForm = null;

  var variants = {
    danger:  { wrap: 'bg-red-100',    icon: 'text-red-600',    btn: 'bg-red-600 hover:bg-red-700',     lucide: 'trash-2'     },
    warning: { wrap: 'bg-yellow-100', icon: 'text-yellow-600', btn: 'bg-yellow-500 hover:bg-yellow-600', lucide: 'ban'       },
    success: { wrap: 'bg-green-100',  icon: 'text-green-600',  btn: 'bg-green-600 hover:bg-green-700', lucide: 'check-circle' },
  };

  function openModal(form) {
    var title   = form.dataset.modalTitle   || '';
    var message = form.dataset.modalMessage || '';
    var variant = variants[form.dataset.modalVariant] || variants.danger;

    titleEl.textContent  = title;
    msgEl.textContent    = message;

    iconWrap.className = 'flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-full ' + variant.wrap;
    iconEl.className   = 'h-5 w-5 ' + variant.icon;
    iconEl.setAttribute('data-lucide', variant.lucide);

    confirmBtn.className = 'px-4 py-2 text-sm rounded-md text-white ' + variant.btn;

    if (window.lucide) { lucide.createIcons(); }

    pendingForm = form;
    modal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    modal.classList.add('hidden');
    document.body.style.overflow = '';
    pendingForm = null;
  }

  // Trigger: any button/link with data-modal-target="confirm-modal"
  document.addEventListener('click', function (e) {
    var trigger = e.target.closest('[data-modal-target="confirm-modal"]');
    if (!trigger) return;
    e.preventDefault();
    var form = trigger.closest('form') || document.getElementById(trigger.dataset.formId);
    if (form) openModal(form);
  });

  cancelBtn.addEventListener('click', closeModal);
  backdrop.addEventListener('click', closeModal);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  confirmBtn.addEventListener('click', function () {
    if (pendingForm) {
      var form = pendingForm;
      closeModal();
      form.submit();
    }
  });
})();
</script>
