<!-- Import CSV Modal — controlled by openImportModal() / closeImportModal() -->
<div id="import-modal"
     class="fixed inset-0 z-50 flex items-center justify-center hidden"
     role="dialog" aria-modal="true">
  <!-- Backdrop -->
  <div id="import-modal-backdrop"
       class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>

  <!-- Dialog -->
  <div class="relative z-10 bg-white rounded-xl shadow-xl border border-gray-200 w-full max-w-md mx-4 p-6">
    <div class="flex items-start gap-3 mb-4">
      <div class="flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-full bg-indigo-100">
        <i data-lucide="upload" class="h-5 w-5 text-indigo-600"></i>
      </div>
      <div class="flex-1">
        <h3 class="text-sm font-semibold text-gray-900">{{ t "ui.import_modal.title" }}</h3>
        <p class="mt-1 text-sm text-gray-500">{{ t "ui.import_modal.description" }}</p>
      </div>
    </div>

    {{ if .ImportErrors }}
    <div class="mb-4 bg-red-50 border border-red-200 rounded-lg p-3">
      <p class="text-xs font-semibold text-red-700 mb-1">{{ t "ui.import_modal.errors_title" }}</p>
      <ul class="text-xs text-red-600 space-y-0.5 list-disc list-inside">
        {{ range .ImportErrors }}
        <li>{{ . }}</li>
        {{ end }}
      </ul>
    </div>
    {{ end }}

    <form id="import-modal-form"
          method="POST"
          action="{{ .ImportAction }}"
          enctype="multipart/form-data">
      <div class="mb-4">
        <div class="flex items-center justify-between mb-1">
          <label class="block text-sm font-medium text-gray-700">{{ t "ui.import_modal.file_label" }}</label>
          {{ if .TemplateAction }}
          <a href="{{ .TemplateAction }}"
             class="inline-flex items-center gap-1 text-xs text-indigo-600 hover:text-indigo-800 hover:underline">
            <i data-lucide="file-down" class="h-3.5 w-3.5"></i>
            {{ t "ui.import_export.download_template" }}
          </a>
          {{ end }}
        </div>
        <input type="file" name="file" accept=".csv,.xlsx,.xls" required
               class="block w-full text-sm text-gray-500
                      file:mr-3 file:py-2 file:px-4
                      file:rounded-md file:border-0
                      file:text-sm file:font-medium
                      file:bg-indigo-50 file:text-indigo-700
                      hover:file:bg-indigo-100">
      </div>
      <div class="flex justify-end gap-2">
        <button type="button"
                onclick="closeImportModal()"
                class="px-4 py-2 text-sm rounded-md border border-gray-300 bg-white text-gray-700 hover:bg-gray-50">
          {{ t "ui.import_modal.cancel" }}
        </button>
        <button type="submit"
                class="px-4 py-2 text-sm rounded-md bg-indigo-600 text-white hover:bg-indigo-700">
          {{ t "ui.import_modal.submit" }}
        </button>
      </div>
    </form>
  </div>
</div>
